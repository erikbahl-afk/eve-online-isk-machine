name: sso-connect
# One-time: swap an EVE SSO login code for a refresh token, stored encrypted in state/sso_token.enc.

on:
  workflow_dispatch:
    inputs:
      code:
        description: "The code= value (or the whole localhost URL) from the EVE login redirect"
        required: true

permissions:
  contents: write

concurrency:
  group: market-run
  cancel-in-progress: false

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Exchange code
        env:
          ESI_CLIENT_SECRET: ${{ secrets.ESI_CLIENT_SECRET }}
          CODE: ${{ inputs.code }}
        run: python -m trader.sso exchange "$CODE"
      - name: Commit encrypted token
        run: |
          git config user.name "isk-machine"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/sso_token.enc
          git commit -q -m "Connect trading character (encrypted SSO token)"
          for i in 1 2 3 4; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          exit 1
