name: market-run
# Snapshot hubs, paper-trade, regenerate INSTRUCTIONS.md

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (GitHub may start it late; the code uses real timestamps)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore working cache (previous snapshots, today's running totals)
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: work-${{ github.run_id }}
          restore-keys: work-

      - name: Run
        run: python -m trader.run > run.log 2>&1 || (cat run.log; exit 1)

      - name: Save working cache
        uses: actions/cache/save@v4
        with:
          path: cache
          key: work-${{ github.run_id }}

      - name: Commit results
        run: |
          tail -n 40 run.log
          git config user.name "isk-machine"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add INSTRUCTIONS.md state data reports
          git diff --cached --quiet && exit 0
          git commit -q -m "run $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          exit 1
